<svg xmlns="http://www.w3.org/2000/svg" width="880" height="754" viewBox="0 0 880 754"><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bf3545"/></marker></defs><rect width="880" height="754" rx="18" fill="#f7f9fd"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><text x="28" y="43" font-size="28" fill="#172b4d" font-weight="650">正确的掩码还必须贴到正确请求行</text><text x="28" y="78" font-size="20" fill="#536580" font-weight="400">谁的约束、哪个前缀、哪个采样位置必须同时匹配</text><rect x="28" y="104" width="395" height="126" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="143" font-size="25" fill="#172b4d" font-weight="600">调度器：紧凑掩码</text><text x="48" y="184" font-size="23" fill="#172b4d" font-weight="400">ID 顺序 [B,D]</text><text x="48" y="216" font-size="22" fill="#172b4d" font-weight="400">行 0 = M_B；行 1 = M_D</text><rect x="457" y="104" width="395" height="126" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="477" y="143" font-size="25" fill="#172b4d" font-weight="600">worker：logits 行</text><text x="477" y="184" font-size="23" fill="#172b4d" font-weight="400">请求顺序 [D,E,B]</text><text x="477" y="216" font-size="21" fill="#172b4d" font-weight="400">E 是无结构化约束的普通请求</text><path d="M226 243 L226 274" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><path d="M654 243 L654 274" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><rect x="28" y="290" width="824" height="79" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="325" font-size="24" fill="#2563eb" font-weight="600">按 ID 定位：B 紧凑行 0 → logits 行 2</text><text x="48" y="355" font-size="24" fill="#2563eb" font-weight="600">                     D 紧凑行 1 → logits 行 0</text><text x="45" y="413" font-size="22" fill="#536580" font-weight="600">logits 行</text><text x="239" y="413" font-size="22" fill="#536580" font-weight="600">请求</text><text x="405" y="413" font-size="22" fill="#536580" font-weight="600">对齐后的掩码</text><rect x="28" y="431" width="824" height="53" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="45" y="466" font-size="23" fill="#172b4d" font-weight="400">0</text><text x="239" y="466" font-size="23" fill="#172b4d" font-weight="400">D</text><text x="405" y="466" font-size="23" fill="#172b4d" font-weight="400">M_D</text><rect x="28" y="493" width="824" height="53" rx="12" fill="#fff5eb" stroke="#cbd7e6" stroke-width="2"/><text x="45" y="528" font-size="23" fill="#172b4d" font-weight="400">1</text><text x="239" y="528" font-size="23" fill="#172b4d" font-weight="400">E</text><text x="405" y="528" font-size="23" fill="#172b4d" font-weight="400">全放行（整数全位一）</text><rect x="28" y="555" width="824" height="53" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="45" y="590" font-size="23" fill="#172b4d" font-weight="400">2</text><text x="239" y="590" font-size="23" fill="#172b4d" font-weight="400">B</text><text x="405" y="590" font-size="23" fill="#172b4d" font-weight="400">M_B</text><text x="28" y="663" font-size="23" fill="#2563eb" font-weight="400">out_indices = [2,0]；不直接把紧凑行覆盖到前两行</text><text x="28" y="702" font-size="20" fill="#536580" font-weight="400">M_B / M_D 是集合标签，不是实际位模式；本图每请求一个 logits 行</text><text x="28" y="732" font-size="19" fill="#536580" font-weight="400">教学示意 · 非运行追踪 · 未测量编译或推理性能</text></g></svg>