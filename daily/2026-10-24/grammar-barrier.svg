<svg xmlns="http://www.w3.org/2000/svg" width="880" height="760" viewBox="0 0 880 760"><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bf3545"/></marker></defs><rect width="880" height="760" rx="18" fill="#f7f9fd"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><text x="28" y="43" font-size="28" fill="#172b4d" font-weight="650">编译就绪之后，还有采样前的状态屏障</text><text x="28" y="78" font-size="20" fill="#536580" font-weight="400">单 rank、无 reasoning、无推测；只展示未停止请求的依赖</text><rect x="28" y="105" width="824" height="80" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="140" font-size="24" fill="#2563eb" font-weight="600">已编译的 B：CPU matcher 仍在 q0，设备已采到 t</text><text x="48" y="172" font-size="21" fill="#172b4d" font-weight="400">下一轮需要“接受 t 后”的合法集合，而不只是一个占位数量</text><rect x="28" y="225" width="395" height="163" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="264" font-size="24" fill="#087f70" font-weight="600">worker：下一轮 forward</text><text x="48" y="304" font-size="23" fill="#172b4d" font-weight="400">用设备 token t 准备输入</text><text x="48" y="343" font-size="23" fill="#172b4d" font-weight="400">得到下一位置 logits</text><text x="48" y="375" font-size="21" fill="#536580" font-weight="400">暂不提交本轮采样</text><rect x="457" y="225" width="395" height="163" rx="12" fill="#fff5eb" stroke="#cbd7e6" stroke-width="2"/><text x="477" y="264" font-size="24" fill="#172b4d" font-weight="600">CPU：旧输出结算</text><text x="477" y="304" font-size="23" fill="#172b4d" font-weight="400">等待 / 取得实际 token t</text><text x="477" y="343" font-size="23" fill="#172b4d" font-weight="400">accept_tokens：q0 → q1</text><text x="477" y="375" font-size="21" fill="#536580" font-weight="400">更新该请求的 matcher</text><path d="M227 403 L330 448" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><path d="M652 403 L550 448" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><rect x="28" y="465" width="824" height="94" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="503" font-size="24" fill="#2563eb" font-weight="600">汇合：按 q1 生成掩码 → 应用到已有 logits → 采样</text><text x="48" y="540" font-size="22" fill="#172b4d" font-weight="400">forward 不必重算；新合法集合必须在采样前准备好</text><rect x="28" y="590" width="824" height="80" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="625" font-size="23" fill="#172b4d" font-weight="400">pending = 结构化请求 且 已有输出占位数 &gt; 0</text><text x="48" y="655" font-size="21" fill="#536580" font-weight="400">条件在增加本轮占位前判断；延后的是整份计划的采样边界</text><text x="28" y="708" font-size="21" fill="#536580" font-weight="400">箭头只表示状态依赖；q0 / q1 / t 不对应实际 tokenizer 轨迹</text><text x="28" y="738" font-size="19" fill="#536580" font-weight="400">教学示意 · 非运行追踪 · 未测量编译或推理性能</text></g></svg>