<svg xmlns="http://www.w3.org/2000/svg" width="880" height="625" viewBox="0 0 880 625"><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bf3545"/></marker></defs><rect width="880" height="625" rx="18" fill="#f7f9fd"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><text x="28" y="43" font-size="28" fill="#172b4d" font-weight="650">批次行的生命期短于请求</text><text x="28" y="77" font-size="19" fill="#536580" font-weight="400">先复用空行，再把剩余空洞压紧；两个分支互斥</text><rect x="28" y="104" width="824" height="78" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="134" font-size="22" fill="#172b4d" font-weight="600">worker 请求缓存 self.requests</text><text x="48" y="166" font-size="21" fill="#172b4d" font-weight="400">B、C、D 仍存活；C 本轮缺席并不等于请求结束</text><text x="28" y="226" font-size="22" fill="#172b4d" font-weight="400">原批次</text><rect x="177" y="192" width="88" height="56" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="190" y="227" font-size="22" fill="#172b4d" font-weight="400">0: B</text><rect x="277" y="192" width="88" height="56" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="290" y="227" font-size="22" fill="#172b4d" font-weight="400">1: C</text><rect x="377" y="192" width="88" height="56" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="390" y="227" font-size="22" fill="#172b4d" font-weight="400">2: D</text><path d="M 496 220 L 568 220" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><text x="584" y="226" font-size="21" fill="#172b4d" font-weight="400">移除 C 的批次行</text><text x="28" y="310" font-size="22" fill="#172b4d" font-weight="400">临时布局</text><rect x="177" y="276" width="88" height="56" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="190" y="311" font-size="22" fill="#172b4d" font-weight="400">0: B</text><rect x="277" y="276" width="88" height="56" rx="12" fill="#fff1f2" stroke="#cbd7e6" stroke-width="2"/><text x="290" y="311" font-size="22" fill="#172b4d" font-weight="400">1: 空</text><rect x="377" y="276" width="88" height="56" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="390" y="311" font-size="22" fill="#172b4d" font-weight="400">2: D</text><text x="508" y="310" font-size="21" fill="#172b4d" font-weight="400">有效数 2，列表长 3</text><path d="M 320 344 L 320 377" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><text x="364" y="370" font-size="21" fill="#087f70" font-weight="400">分支一：新请求 E 填洞</text><rect x="177" y="392" width="88" height="56" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="190" y="427" font-size="22" fill="#172b4d" font-weight="400">0: B</text><rect x="277" y="392" width="88" height="56" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="290" y="427" font-size="22" fill="#172b4d" font-weight="400">1: E</text><rect x="377" y="392" width="88" height="56" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="390" y="427" font-size="22" fill="#172b4d" font-weight="400">2: D</text><text x="508" y="426" font-size="22" fill="#087f70" font-weight="400">D 保持行 2</text><text x="28" y="488" font-size="21" fill="#172b4d" font-weight="400">或：无新请求</text><text x="269" y="488" font-size="21" fill="#172b4d" font-weight="400">condense：尾行 D 从 2 移到 1</text><rect x="177" y="509" width="88" height="56" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="190" y="544" font-size="22" fill="#172b4d" font-weight="400">0: B</text><rect x="277" y="509" width="88" height="56" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="290" y="544" font-size="22" fill="#172b4d" font-weight="400">1: D</text><text x="410" y="543" font-size="21" fill="#2563eb" font-weight="400">紧凑前缀；D 的映射改成 1</text><text x="28" y="603" font-size="18" fill="#536580" font-weight="400">教学示意 · 非运行追踪 · 固定源码的简化状态关系</text></g></svg>