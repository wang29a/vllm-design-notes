<svg xmlns="http://www.w3.org/2000/svg" width="880" height="671" viewBox="0 0 880 671"><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bf3545"/></marker></defs><rect width="880" height="671" rx="18" fill="#f7f9fd"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><text x="28" y="43" font-size="28" fill="#172b4d" font-weight="650">换行必须保留请求的整组状态</text><text x="28" y="77" font-size="19" fill="#536580" font-weight="400">条件示例：后端启用重排，decode_threshold=1</text><text x="28" y="124" font-size="23" fill="#2563eb" font-weight="600">重排前 [B,D]</text><rect x="28" y="141" width="395" height="155" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="47" y="177" font-size="25" fill="#172b4d" font-weight="600">行 0 → B</text><text x="47" y="211" font-size="22" fill="#172b4d" font-weight="400">token_B · computed=6</text><text x="47" y="243" font-size="22" fill="#172b4d" font-weight="400">blocks_B · temperature_B</text><text x="47" y="274" font-size="21" fill="#172b4d" font-weight="400">本轮 2 token → long_extend</text><rect x="457" y="141" width="395" height="155" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="477" y="177" font-size="25" fill="#172b4d" font-weight="600">行 1 → D</text><text x="477" y="211" font-size="22" fill="#172b4d" font-weight="400">token_D · prompt 已完成</text><text x="477" y="243" font-size="22" fill="#172b4d" font-weight="400">blocks_D · temperature_D</text><text x="477" y="274" font-size="21" fill="#172b4d" font-weight="400">本轮 1 token → decode</text><path d="M 225 311 L 622 354" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><path d="M 656 311 L 260 354" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><text x="28" y="354" font-size="21" fill="#536580" font-weight="400">交换整组状态</text><rect x="28" y="378" width="395" height="128" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="47" y="413" font-size="25" fill="#172b4d" font-weight="600">行 0 → D</text><text x="47" y="448" font-size="22" fill="#172b4d" font-weight="400">token_D · D 的进度</text><text x="47" y="483" font-size="22" fill="#172b4d" font-weight="400">blocks_D · temperature_D</text><rect x="457" y="378" width="395" height="128" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="477" y="413" font-size="25" fill="#172b4d" font-weight="600">行 1 → B</text><text x="477" y="448" font-size="22" fill="#172b4d" font-weight="400">token_B · computed=6</text><text x="477" y="483" font-size="22" fill="#172b4d" font-weight="400">blocks_B · temperature_B</text><rect x="28" y="528" width="824" height="91" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="47" y="562" font-size="23" fill="#2563eb" font-weight="600">块表行随请求移动，物理 KV 内容保持原位置</text><text x="47" y="595" font-size="21" fill="#172b4d" font-weight="400">行号键的 generator 也要迁移；随后通知 logits processors</text><text x="28" y="649" font-size="18" fill="#536580" font-weight="400">教学示意 · 非运行追踪 · 固定源码的简化状态关系</text></g></svg>