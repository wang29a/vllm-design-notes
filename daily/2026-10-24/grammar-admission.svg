<svg xmlns="http://www.w3.org/2000/svg" width="880" height="735" viewBox="0 0 880 735"><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bf3545"/></marker></defs><rect width="880" height="735" rx="18" fill="#f7f9fd"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><text x="28" y="43" font-size="28" fill="#172b4d" font-weight="650">grammar 是请求准入的一道准备条件</text><text x="28" y="78" font-size="20" fill="#536580" font-weight="400">普通 V1 文本路径；以 xgrammar 为例；不展示实际执行时间</text><rect x="28" y="104" width="824" height="89" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="140" font-size="25" fill="#2563eb" font-weight="600">B：等待 grammar，尚未进入普通资源准入</text><text x="48" y="175" font-size="22" fill="#172b4d" font-weight="400">WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR</text><path d="M441 206 L441 238" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><rect x="28" y="254" width="824" height="78" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="287" font-size="24" fill="#172b4d" font-weight="400">grammar_init 提交 Future；调度时限时检查结果</text><text x="48" y="316" font-size="21" fill="#536580" font-weight="400">grammar 属性返回 None / 可用对象 / Exception</text><path d="M180 346 L159 380" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><path d="M441 346 L441 380" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><path d="M702 346 L724 380" fill="none" stroke="#bf3545" stroke-width="3" marker-end="url(#red)"/><rect x="28" y="397" width="260" height="120" rx="12" fill="#fff5eb" stroke="#cbd7e6" stroke-width="2"/><text x="47" y="438" font-size="23" fill="#172b4d" font-weight="600">None：还没就绪</text><text x="47" y="481" font-size="23" fill="#172b4d" font-weight="400">继续阻塞等待</text><rect x="310" y="397" width="260" height="120" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="329" y="438" font-size="23" fill="#087f70" font-weight="600">可用 grammar</text><text x="329" y="481" font-size="23" fill="#087f70" font-weight="400">恢复 WAITING</text><rect x="592" y="397" width="260" height="120" rx="12" fill="#fff0f2" stroke="#cbd7e6" stroke-width="2"/><text x="611" y="438" font-size="23" fill="#bf3545" font-weight="600">Exception</text><text x="611" y="481" font-size="23" fill="#bf3545" font-weight="400">登记请求错误</text><rect x="28" y="548" width="824" height="92" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="584" font-size="24" fill="#087f70" font-weight="600">成功：仍需竞争 token 预算与 KV 容量</text><text x="48" y="619" font-size="22" fill="#bf3545" font-weight="400">失败：在结果更新路径按 FINISHED_ERROR 结束</text><text x="28" y="682" font-size="22" fill="#536580" font-weight="400">其他请求按自身条件继续调度；Future 完成不等于 grammar 可用</text><text x="28" y="713" font-size="19" fill="#536580" font-weight="400">教学示意 · 非运行追踪 · 未测量编译或推理性能</text></g></svg>