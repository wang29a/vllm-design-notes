<svg xmlns="http://www.w3.org/2000/svg" width="880" height="618" viewBox="0 0 880 618"><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bf3545"/></marker></defs><rect width="880" height="618" rx="18" fill="#f7f9fd"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><text x="28" y="43" font-size="28" fill="#172b4d" font-weight="650">结果携带自己的行映射</text><text x="28" y="77" font-size="19" fill="#536580" font-weight="400">请求 ID 稳定；行号只在对应布局和结果中有效</text><rect x="28" y="111" width="395" height="228" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="147" font-size="25" fill="#172b4d" font-weight="600">这份输出所属的布局</text><text x="48" y="186" font-size="24" fill="#172b4d" font-weight="400">req_ids = [D, B]</text><text x="48" y="224" font-size="23" fill="#172b4d" font-weight="400">映射副本：D→0，B→1</text><text x="48" y="265" font-size="23" fill="#172b4d" font-weight="400">结果行 0：[d_next]</text><text x="48" y="305" font-size="23" fill="#172b4d" font-weight="400">结果行 1：[b_next]</text><rect x="457" y="111" width="395" height="228" rx="12" fill="#fff6ef" stroke="#cbd7e6" stroke-width="2"/><text x="478" y="147" font-size="25" fill="#172b4d" font-weight="600">后续可变批次的布局</text><text x="478" y="186" font-size="24" fill="#172b4d" font-weight="400">req_ids = [B, D]</text><text x="478" y="224" font-size="23" fill="#172b4d" font-weight="400">当前映射：B→0，D→1</text><text x="478" y="270" font-size="22" fill="#536580" font-weight="400">新布局不会重写旧副本</text><text x="478" y="309" font-size="20" fill="#536580" font-weight="400">此图不表示真实并发时序</text><path d="M 217 350 L 217 390" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><path d="M 654 350 L 654 390" fill="none" stroke="#bf3545" stroke-width="3" marker-end="url(#red)"/><rect x="28" y="404" width="395" height="112" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="442" font-size="24" fill="#087f70" font-weight="600">认领 B：使用输出副本</text><text x="48" y="485" font-size="25" fill="#087f70" font-weight="400">B→1 → b_next  ✓</text><rect x="457" y="404" width="395" height="112" rx="12" fill="#fff0f2" stroke="#cbd7e6" stroke-width="2"/><text x="478" y="442" font-size="23" fill="#bf3545" font-weight="600">误用当前映射认领 B</text><text x="478" y="485" font-size="25" fill="#bf3545" font-weight="400">B→0 → d_next  ×</text><text x="28" y="560" font-size="22" fill="#172b4d" font-weight="400">身份核对之后，仍须检查请求是否取消、结束或输出过期</text><text x="28" y="596" font-size="18" fill="#536580" font-weight="400">教学示意 · 非运行追踪 · 固定源码的简化状态关系</text></g></svg>