<svg xmlns="http://www.w3.org/2000/svg" width="880" height="650" viewBox="0 0 880 650"><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bf3545"/></marker></defs><rect width="880" height="650" rx="18" fill="#f7f9fd"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><text x="28" y="43" font-size="28" fill="#172b4d" font-weight="650">replay 复用地址中的执行，不复用旧答案</text><text x="28" y="78" font-size="20" fill="#536580" font-weight="400">相同 shape 还需要正确地址、最新值与合法生命周期</text><rect x="28" y="108" width="395" height="131" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="145" font-size="25" fill="#172b4d" font-weight="600">捕获时：固定存储 A</text><text x="48" y="185" font-size="23" fill="#172b4d" font-weight="400">[b0, d0, pad, pad]</text><text x="48" y="220" font-size="21" fill="#172b4d" font-weight="400">图记录既定执行与所用地址</text><path d="M441 172 L493 172" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><rect x="511" y="108" width="341" height="131" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="531" y="145" font-size="25" fill="#087f70" font-weight="600">以后：仍更新 A</text><text x="531" y="185" font-size="23" fill="#172b4d" font-weight="400">[b1, d1, pad, pad]</text><text x="531" y="220" font-size="22" fill="#172b4d" font-weight="400">地址不变，值改变</text><path d="M682 251 L682 291" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><rect x="511" y="306" width="341" height="100" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="531" y="343" font-size="24" fill="#087f70" font-weight="600">同一个 graph.replay()</text><text x="531" y="382" font-size="22" fill="#172b4d" font-weight="400">读取 A 中准备好的新值</text><rect x="28" y="306" width="395" height="100" rx="12" fill="#fff0f2" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="343" font-size="22" fill="#bf3545" font-weight="600">反例：新分配 A'，长度也为 4</text><text x="48" y="382" font-size="23" fill="#bf3545" font-weight="400">旧图不会自动改读 A'</text><rect x="28" y="443" width="824" height="111" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="480" font-size="22" fill="#172b4d" font-weight="400">仍由 CPU 每轮推进：调度、派发、输入更新、结果处理</text><text x="48" y="519" font-size="22" fill="#2563eb" font-weight="400">图输出存储可能复用；跨轮保存要遵守消费或复制协议</text><text x="28" y="595" font-size="21" fill="#536580" font-weight="400">A / A' 是教学标签；此图不表示实际指针或 CUDA stream 轨迹</text><text x="28" y="628" font-size="19" fill="#536580" font-weight="400">教学示意 · 非运行追踪 · 未测量 GPU 性能</text></g></svg>