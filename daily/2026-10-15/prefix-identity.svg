<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="title desc">
<title id="title">块身份继承祖先前缀</title><desc id="desc">A、B 的前两段相同，第二块身份相同；C 第一段不同，即使第二段局部 token 相同，也使用不同父 hash。教学示意，不讨论哈希碰撞。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52637a" stroke-width="1.5"/></marker></defs>
<rect width="720" height="350" rx="20" fill="#f5f7fb"/>
<g font-family="Arial, PingFang SC, sans-serif" fill="#17233a">
<text x="28" y="40" font-size="23" font-weight="700">局部 token 相同，还要看父前缀身份</text>
<text x="28" y="70" font-size="16" fill="#52637a">示例每块两个 token；h、g 是身份符号，并非实际摘要</text>
<g fill="none" stroke="#52637a" stroke-width="2" marker-end="url(#arrow)"><path d="M326 136H380"/><path d="M326 238H380"/></g>
<rect x="28" y="97" width="298" height="78" rx="12" fill="#e9efff" stroke="#aabdf0"/>
<rect x="382" y="97" width="310" height="78" rx="12" fill="#e9f5f1" stroke="#9acbbc"/>
<rect x="28" y="199" width="298" height="78" rx="12" fill="#fff2df" stroke="#e3c396"/>
<rect x="382" y="199" width="310" height="78" rx="12" fill="#f0eafa" stroke="#c4aedf"/>
<g text-anchor="middle" font-size="19"><text x="177" y="128">A、B 第一块：[1, 2]</text><text x="177" y="155">父链形成 h0</text><text x="537" y="128">第二块：[3, 4]</text><text x="537" y="155">H(h0, [3, 4], extra) → h1</text><text x="177" y="230">C 第一块：[8, 2]</text><text x="177" y="257">父链形成 g0</text><text x="537" y="230">第二块：[3, 4]</text><text x="537" y="257">H(g0, [3, 4], extra) → g1</text></g>
<text x="28" y="319" font-size="15" fill="#52637a">教学示意：图未展开 extra keys、KV group ID 与哈希碰撞边界。</text>
</g></svg>
