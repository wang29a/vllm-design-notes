<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">vLLM V1 请求状态闭环</title>
<desc id="desc">请求进度进入调度器，KV 管理确认容量，计划交给执行器，结果回写修正下一轮状态。教学示意，不是运行追踪。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#52637a" stroke-width="1.4"/></marker></defs>
<rect width="1000" height="440" rx="24" fill="#f5f7fb"/>
<g font-family="Arial, PingFang SC, sans-serif">
<text x="40" y="50" fill="#17233a" font-size="25" font-weight="700">一个请求，三道相互约束的边界</text>
<text x="40" y="80" fill="#52637a" font-size="16">V1 核心循环 · 固定提交的静态源码分析</text>
<g stroke="#52637a" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M240 170H288"/><path d="M480 170H528"/><path d="M720 170H768"/><path d="M385 284V224"/><path d="M865 226V383H145V226"/></g>
<g stroke-width="1.5">
<rect x="40" y="124" width="200" height="102" rx="16" fill="#e9efff" stroke="#aabdf0"/>
<rect x="290" y="124" width="190" height="102" rx="16" fill="#e9efff" stroke="#aabdf0"/>
<rect x="530" y="124" width="190" height="102" rx="16" fill="#e9f5f1" stroke="#9acbbc"/>
<rect x="770" y="124" width="190" height="102" rx="16" fill="#f0eafa" stroke="#c4aedf"/>
<rect x="270" y="286" width="230" height="66" rx="14" fill="#fff2df" stroke="#e3c396"/>
</g>
<g fill="#17233a" font-size="21" font-weight="700" text-anchor="middle"><text x="140" y="160">请求进度</text><text x="385" y="160">调度计划</text><text x="625" y="160">模型执行</text><text x="865" y="160">结果回写</text><text x="385" y="313">KV 容量与块映射</text></g>
<g fill="#52637a" font-size="15" text-anchor="middle"><text x="140" y="188">已知 / 计划 / 在途</text><text x="140" y="210">Request</text><text x="385" y="188">每请求 token 份额</text><text x="385" y="210">SchedulerOutput</text><text x="625" y="188">计算与采样</text><text x="625" y="210">ModelRunnerOutput</text><text x="865" y="188">接受 / 拒绝 / 结束</text><text x="865" y="210">下一轮有效状态</text><text x="385" y="337">准入、预留、回收</text></g>
<text x="530" y="372" fill="#52637a" font-size="15">回写决定下一轮的进度与生命周期</text>
<text x="40" y="417" fill="#52637a" font-size="14">教学示意：箭头表示接口与状态依赖，不表示实际耗时或所有配置的串行时序。</text>
</g></svg>
