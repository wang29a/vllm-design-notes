<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="title desc">
<title id="title">请求引用释放与缓存淘汰是不同边界</title><desc id="desc">A、B 共享块 7，A 结束后引用二变一；B 释放后变零并进入 free 队列，hash 仍保留；块被 C 重新分配时旧 hash 被移除。教学示意。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52637a" stroke-width="1.5"/></marker></defs>
<rect width="720" height="350" rx="20" fill="#f5f7fb"/>
<g font-family="Arial, PingFang SC, sans-serif" fill="#17233a">
<text x="28" y="40" font-size="23" font-weight="700">同一物理块 7：引用归零，不等于旧键失效</text>
<text x="28" y="70" font-size="16" fill="#52637a">限定：无额外内部引用，pool 收到实际 free，缓存开启</text>
<g fill="none" stroke="#52637a" stroke-width="2" marker-end="url(#arrow)"><path d="M178 165H197"/><path d="M348 165H367"/><path d="M518 165H537"/></g>
<rect x="28" y="103" width="150" height="125" rx="12" fill="#e9efff" stroke="#aabdf0"/>
<rect x="198" y="103" width="150" height="125" rx="12" fill="#e9efff" stroke="#aabdf0"/>
<rect x="368" y="103" width="150" height="125" rx="12" fill="#fff2df" stroke="#e3c396"/>
<rect x="538" y="103" width="154" height="125" rx="12" fill="#e9f5f1" stroke="#9acbbc"/>
<g text-anchor="middle"><g font-size="20" font-weight="700"><text x="103" y="134">A、B 持有</text><text x="273" y="134">A 已释放</text><text x="443" y="134">B 也释放</text><text x="615" y="134">C 重新分配</text></g>
<g font-size="18"><text x="103" y="164">ref = 2</text><text x="273" y="164">ref = 1</text><text x="443" y="164">ref = 0</text><text x="615" y="164">ref = 1</text><text x="103" y="190">hash 保留</text><text x="273" y="190">hash 保留</text><text x="443" y="190">hash 保留</text><text x="615" y="190">旧 hash 移除</text><text x="103" y="216">不在 free</text><text x="273" y="216">不在 free</text><text x="443" y="216">在 free</text><text x="615" y="216">不在 free</text></g></g>
<text x="28" y="271" font-size="18">若同前缀请求先命中：touch → 引用增加，旧 hash 继续保留</text>
<text x="28" y="317" font-size="15" fill="#52637a">教学示意：元数据淘汰不是 GPU 内容清零；异步释放还须满足在途边界。</text>
</g></svg>
