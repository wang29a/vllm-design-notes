<svg xmlns="http://www.w3.org/2000/svg" width="880" height="729" viewBox="0 0 880 729"><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bf3545"/></marker></defs><rect width="880" height="729" rx="18" fill="#f7f9fd"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><text x="28" y="43" font-size="28" fill="#172b4d" font-weight="650">下一轮输入同时来自 GPU 结果与 CPU prompt</text><text x="28" y="78" font-size="20" fill="#536580" font-weight="400">合法换序的教学例子；并非指定后端的实际排序记录</text><rect x="28" y="102" width="395" height="114" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="140" font-size="24" fill="#172b4d" font-weight="600">上一轮设备采样 [B,D]</text><text x="48" y="179" font-size="23" fill="#172b4d" font-weight="400">行 0 → b0；行 1 → d0</text><text x="48" y="205" font-size="20" fill="#536580" font-weight="400">值留在 GPU，CPU 可暂存占位符</text><rect x="457" y="102" width="395" height="114" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="477" y="140" font-size="24" fill="#172b4d" font-weight="600">当前布局 [D,B,E]</text><text x="477" y="179" font-size="23" fill="#172b4d" font-weight="400">安排量 [1,1,2]</text><text x="477" y="205" font-size="20" fill="#536580" font-weight="400">E 的 prompt 为 e0、e1</text><path d="M225 229 L225 267" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><path d="M650 229 L650 267" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><rect x="28" y="283" width="824" height="94" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="318" font-size="24" fill="#2563eb" font-weight="600">按请求 ID 查询：prev_positions = [1,0,-1]</text><text x="48" y="353" font-size="22" fill="#172b4d" font-weight="400">D ← 旧行 1；B ← 旧行 0；E 没有旧采样行</text><rect x="28" y="403" width="824" height="91" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="438" font-size="23" fill="#172b4d" font-weight="400">当前前缀和 [1,2,4] → D、B 的目标位置 [0,1]</text><text x="48" y="474" font-size="22" fill="#172b4d" font-weight="400">先上传 CPU 数据，再按源行 [1,0] 补写目标 [0,1]</text><path d="M441 508 L441 543" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><rect x="28" y="560" width="824" height="72" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="604" font-size="28" fill="#087f70" font-weight="600">最终 input_ids = [d0, b0, e0, e1]</text><text x="28" y="675" font-size="23" fill="#2563eb" font-weight="400">新行号、旧采样行、展平输入位置是三个不同坐标</text><text x="28" y="707" font-size="19" fill="#536580" font-weight="400">教学示意 · 非运行追踪 · 未测量 GPU 性能</text></g></svg>