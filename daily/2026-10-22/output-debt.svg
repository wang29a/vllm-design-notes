<svg xmlns="http://www.w3.org/2000/svg" width="880" height="710" viewBox="0 0 880 710"><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bf3545"/></marker></defs><rect width="880" height="710" rx="18" fill="#f7f9fd"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><text x="28" y="43" font-size="28" fill="#172b4d" font-weight="650">未知输出用数量占位，真实值稍后结算</text><text x="28" y="78" font-size="20" fill="#536580" font-weight="400">普通连续 decode；无推测；假设本轮不停止且资源充足</text><rect x="28" y="102" width="824" height="66" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="47" y="142" font-size="24" fill="#2563eb" font-weight="600">下一步差额 = 已知 token 数 N + 待回填数 P − 进度 C</text><text x="45" y="211" font-size="23" fill="#536580" font-weight="600">状态</text><text x="330" y="211" font-size="23" fill="#536580" font-weight="600">N</text><text x="427" y="211" font-size="23" fill="#536580" font-weight="600">C</text><text x="525" y="211" font-size="23" fill="#536580" font-weight="600">P</text><text x="625" y="211" font-size="23" fill="#536580" font-weight="600">N+P−C</text><rect x="28" y="230" width="824" height="55" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="45" y="266" font-size="23" fill="#172b4d" font-weight="400">安排前</text><text x="330" y="266" font-size="23" fill="#172b4d" font-weight="400">8</text><text x="427" y="266" font-size="23" fill="#172b4d" font-weight="400">7</text><text x="525" y="266" font-size="23" fill="#172b4d" font-weight="400">0</text><text x="625" y="266" font-size="23" fill="#172b4d" font-weight="400">1</text><rect x="28" y="294" width="824" height="55" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="45" y="330" font-size="23" fill="#172b4d" font-weight="400">提交第 1 步后</text><text x="330" y="330" font-size="23" fill="#172b4d" font-weight="400">8</text><text x="427" y="330" font-size="23" fill="#172b4d" font-weight="400">8</text><text x="525" y="330" font-size="23" fill="#172b4d" font-weight="400">1</text><text x="625" y="330" font-size="23" fill="#172b4d" font-weight="400">1</text><rect x="28" y="358" width="824" height="55" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="45" y="394" font-size="23" fill="#172b4d" font-weight="400">提交第 2 步后</text><text x="330" y="394" font-size="23" fill="#172b4d" font-weight="400">8</text><text x="427" y="394" font-size="23" fill="#172b4d" font-weight="400">9</text><text x="525" y="394" font-size="23" fill="#172b4d" font-weight="400">2</text><text x="625" y="394" font-size="23" fill="#172b4d" font-weight="400">1</text><rect x="28" y="422" width="824" height="55" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="45" y="458" font-size="23" fill="#172b4d" font-weight="400">第 1 份输出结算后</text><text x="330" y="458" font-size="23" fill="#172b4d" font-weight="400">9</text><text x="427" y="458" font-size="23" fill="#172b4d" font-weight="400">9</text><text x="525" y="458" font-size="23" fill="#172b4d" font-weight="400">1</text><text x="625" y="458" font-size="23" fill="#172b4d" font-weight="400">1</text><rect x="28" y="516" width="824" height="103" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="552" font-size="24" fill="#bf3545" font-weight="600">C 已推进，不代表设备计算已完成</text><text x="48" y="589" font-size="22" fill="#172b4d" font-weight="400">单 rank、V1 异步例子：最多保留 2 份并发批次</text><text x="28" y="658" font-size="21" fill="#536580" font-weight="400">表格只展示计数变化；未画停止、抢占、推测拒绝与设备时序</text><text x="28" y="688" font-size="19" fill="#536580" font-weight="400">教学示意 · 非运行追踪 · 未测量 GPU 性能</text></g></svg>