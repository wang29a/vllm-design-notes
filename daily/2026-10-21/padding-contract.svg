<svg xmlns="http://www.w3.org/2000/svg" width="880" height="722" viewBox="0 0 880 722"><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bf3545"/></marker></defs><rect width="880" height="722" rx="18" fill="#f7f9fd"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><text x="28" y="43" font-size="28" fill="#172b4d" font-weight="650">padding 不会成为新的真实请求</text><text x="28" y="78" font-size="20" fill="#536580" font-weight="400">不同字段分别约束区段、读取、持久写入和输出选择</text><rect x="28" y="104" width="824" height="67" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="145" font-size="25" fill="#2563eb" font-weight="600">FULL：2 个真实 token / 请求 → 4 槽 / 请求容量</text><text x="44" y="212" font-size="22" fill="#536580" font-weight="600">行</text><text x="150" y="212" font-size="22" fill="#536580" font-weight="600">query 段</text><text x="331" y="212" font-size="22" fill="#536580" font-weight="600">seq_len</text><text x="487" y="212" font-size="22" fill="#536580" font-weight="600">块表行</text><text x="675" y="212" font-size="22" fill="#536580" font-weight="600">写入 slot</text><rect x="28" y="228" width="824" height="52" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="44" y="262" font-size="22" fill="#172b4d" font-weight="400">B</text><text x="150" y="262" font-size="22" fill="#172b4d" font-weight="400">[0,1)</text><text x="331" y="262" font-size="22" fill="#172b4d" font-weight="400">L_B</text><text x="487" y="262" font-size="22" fill="#172b4d" font-weight="400">B 的块号</text><text x="675" y="262" font-size="22" fill="#172b4d" font-weight="400">s_B</text><rect x="28" y="288" width="824" height="52" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="44" y="322" font-size="22" fill="#172b4d" font-weight="400">D</text><text x="150" y="322" font-size="22" fill="#172b4d" font-weight="400">[1,2)</text><text x="331" y="322" font-size="22" fill="#172b4d" font-weight="400">L_D</text><text x="487" y="322" font-size="22" fill="#172b4d" font-weight="400">D 的块号</text><text x="675" y="322" font-size="22" fill="#172b4d" font-weight="400">s_D</text><rect x="28" y="348" width="824" height="52" rx="12" fill="#fff4ed" stroke="#cbd7e6" stroke-width="2"/><text x="44" y="382" font-size="22" fill="#172b4d" font-weight="400">padding</text><text x="150" y="382" font-size="22" fill="#172b4d" font-weight="400">[2,2)</text><text x="331" y="382" font-size="22" fill="#172b4d" font-weight="400">0</text><text x="487" y="382" font-size="22" fill="#172b4d" font-weight="400">null block</text><text x="675" y="382" font-size="22" fill="#172b4d" font-weight="400">-1</text><rect x="28" y="408" width="824" height="52" rx="12" fill="#fff4ed" stroke="#cbd7e6" stroke-width="2"/><text x="44" y="442" font-size="22" fill="#172b4d" font-weight="400">padding</text><text x="150" y="442" font-size="22" fill="#172b4d" font-weight="400">[2,2)</text><text x="331" y="442" font-size="22" fill="#172b4d" font-weight="400">0</text><text x="487" y="442" font-size="22" fill="#172b4d" font-weight="400">null block</text><text x="675" y="442" font-size="22" fill="#172b4d" font-weight="400">-1</text><rect x="28" y="489" width="824" height="96" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="525" font-size="24" fill="#2563eb" font-weight="600">query_start_loc = [0,1,2,2,2]</text><text x="48" y="562" font-size="23" fill="#172b4d" font-weight="400">is_padding = [False,False,True,True]</text><text x="28" y="626" font-size="22" fill="#172b4d" font-weight="400">负槽让写缓存 kernel 返回；空区段和零长度约束 attention</text><text x="28" y="664" font-size="22" fill="#087f70" font-weight="400">logits_indices = [0,1]：只为两个真实请求提取采样输入</text><text x="28" y="700" font-size="19" fill="#536580" font-weight="400">教学示意 · 非运行追踪 · 未测量 GPU 性能</text></g></svg>