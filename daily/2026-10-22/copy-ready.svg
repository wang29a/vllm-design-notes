<svg xmlns="http://www.w3.org/2000/svg" width="880" height="759" viewBox="0 0 880 759"><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bf3545"/></marker></defs><rect width="880" height="759" rx="18" fill="#f7f9fd"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><text x="28" y="43" font-size="28" fill="#172b4d" font-weight="650">输出分三道约束：顺序、存活、读取完成</text><text x="28" y="78" font-size="20" fill="#536580" font-weight="400">CPU 可在最终读取前继续准备；需要真实历史的功能仍可能等待</text><text x="28" y="125" font-size="22" fill="#172b4d" font-weight="600">生产 stream</text><rect x="224" y="100" width="285" height="69" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="245" y="143" font-size="24" fill="#172b4d" font-weight="400">采样产生 b0、d0</text><path d="M368 181 L368 227" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><text x="28" y="272" font-size="22" fill="#172b4d" font-weight="600">copy stream</text><rect x="224" y="243" width="285" height="68" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="244" y="286" font-size="23" fill="#172b4d" font-weight="400">先等待生产，再 D2H</text><path d="M524 277 L574 277" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><rect x="591" y="243" width="261" height="68" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="612" y="286" font-size="23" fill="#087f70" font-weight="600">记录 ready 事件</text><rect x="28" y="348" width="824" height="85" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="384" font-size="24" fill="#172b4d" font-weight="400">复制期间：对象保留源 GPU 张量引用</text><text x="48" y="415" font-size="21" fill="#536580" font-weight="400">保护存活期；不等于允许随意原地覆盖</text><text x="28" y="489" font-size="22" fill="#172b4d" font-weight="600">CPU 消费</text><rect x="224" y="456" width="628" height="98" rx="12" fill="#fff5eb" stroke="#cbd7e6" stroke-width="2"/><text x="244" y="493" font-size="23" fill="#172b4d" font-weight="400">get_output → 等待 ready → 转列表 / 解析</text><text x="244" y="530" font-size="22" fill="#172b4d" font-weight="400">随后用原始调度计划与输出映射完成结算</text><path d="M719 321 L719 444" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><rect x="28" y="587" width="824" height="77" rx="12" fill="#fff0f2" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="621" font-size="25" fill="#bf3545" font-weight="600">non_blocking 返回 ≠ CPU 数据已可安全读取</text><text x="48" y="650" font-size="20" fill="#172b4d" font-weight="400">后续 GPU 输入补写与 CPU 输出读取各自遵守依赖</text><text x="28" y="706" font-size="21" fill="#536580" font-weight="400">线段长度无时间含义；只画依赖关系，不表示已观测到传输重叠</text><text x="28" y="737" font-size="19" fill="#536580" font-weight="400">教学示意 · 非运行追踪 · 未测量 GPU 性能</text></g></svg>