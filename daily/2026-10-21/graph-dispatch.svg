<svg xmlns="http://www.w3.org/2000/svg" width="880" height="643" viewBox="0 0 880 643"><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bf3545"/></marker></defs><rect width="880" height="643" rx="18" fill="#f7f9fd"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><text x="28" y="43" font-size="28" fill="#172b4d" font-weight="650">选择 graph：尺寸与模式共同决定</text><text x="28" y="78" font-size="20" fill="#536580" font-weight="400">普通文本；无推测 / 并行 / 微批次；假设后端支持所选模式</text><rect x="28" y="104" width="824" height="62" rx="12" fill="#fff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="143" font-size="23" fill="#2563eb" font-weight="600">假设捕获尺寸 [1,4,8]，模式 FULL_AND_PIECEWISE</text><rect x="28" y="193" width="330" height="140" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="231" font-size="22" fill="#172b4d" font-weight="600">第一轮：B 处理 2，D 处理 1</text><text x="48" y="271" font-size="23" fill="#172b4d" font-weight="400">真实总量 3 → 补齐到 4</text><text x="48" y="309" font-size="22" fill="#172b4d" font-weight="400">uniform_decode = False</text><path d="M375 260 L437 260" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><rect x="457" y="193" width="395" height="140" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="477" y="231" font-size="26" fill="#087f70" font-weight="600">PIECEWISE</text><text x="477" y="272" font-size="23" fill="#172b4d" font-weight="400">key = (4, None, False)</text><text x="477" y="309" font-size="21" fill="#172b4d" font-weight="400">请求数不作为这个图键的区分项</text><rect x="28" y="366" width="330" height="140" rx="12" fill="#edf4ff" stroke="#cbd7e6" stroke-width="2"/><text x="48" y="404" font-size="22" fill="#172b4d" font-weight="600">下一轮：B、D 各处理 1</text><text x="48" y="444" font-size="23" fill="#172b4d" font-weight="400">真实总量 2 → 补齐到 4</text><text x="48" y="482" font-size="22" fill="#172b4d" font-weight="400">uniform_decode = True</text><path d="M375 433 L437 433" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><rect x="457" y="366" width="395" height="140" rx="12" fill="#eaf8f3" stroke="#cbd7e6" stroke-width="2"/><text x="477" y="404" font-size="26" fill="#087f70" font-weight="600">FULL</text><text x="477" y="445" font-size="23" fill="#172b4d" font-weight="400">key = (4, 4, True)</text><text x="477" y="482" font-size="22" fill="#172b4d" font-weight="400">图容量 4；真实请求仍为 2</text><text x="28" y="548" font-size="21" fill="#172b4d" font-weight="400">key 展示：(num_tokens, num_reqs, uniform)；省略无 LoRA 字段</text><text x="28" y="585" font-size="21" fill="#2563eb" font-weight="400">尺寸相同 ≠ 执行模式相同；键集合与实际图对象也分别维护</text><text x="28" y="621" font-size="19" fill="#536580" font-weight="400">教学示意 · 非运行追踪 · 未测量 GPU 性能</text></g></svg>